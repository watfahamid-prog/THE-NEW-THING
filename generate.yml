name: Generate Viral Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic. Leave empty for autonomous trend discovery."
        required: false
        type: string
      longform:
        description: "Generate a 4-6 minute landscape YouTube video instead of a Short."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg + TTS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version

      - name: Verify FFmpeg subtitle rendering
        run: |
          if ! ffmpeg -hide_banner -filters | grep -E '(^|[[:space:]])ass([[:space:]]|$)'; then
            echo "ASS subtitle filter is missing from the FFmpeg binary"
            ffmpeg -hide_banner -filters
            exit 1
          fi

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.topic }}" ]; then
            if [ "${{ inputs.longform }}" = "true" ]; then
              python main.py --topic "${{ inputs.topic }}" --longform
            else
              python main.py --topic "${{ inputs.topic }}"
            fi
          else
            python main.py --autopilot
          fi

      - name: Upload final video only
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          path: output/**/final.mp4
          if-no-files-found: error
          retention-days: 7
