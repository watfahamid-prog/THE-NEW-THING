name: Sample Videos
# Hash-based Pexels duplicate protection enabled

on:
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg + TTS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version

      - name: Verify subtitle support
        run: |
          ffmpeg -hide_banner -filters | grep -E '(^|[[:space:]])ass([[:space:]]|$)'

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Generate samples sequentially
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -e
          test -n "$GEMINI_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -n "$YOUTUBE_API_KEY"
          python main.py --autopilot
          python main.py --autopilot
          python main.py --autopilot

      - name: Commit persistent topic and Pexels history
        run: |
          if git diff --quiet -- data/pexels_history.json data/topic_history.json; then
            echo "No topic or Pexels history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pexels_history.json data/topic_history.json
          git commit -m "Persist autonomous topic and Pexels history"
          git push

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: samples
          path: output/**/final.mp4
          if-no-files-found: error
          retention-days: 7
