name: Sample Videos
# Hash-based Pexels duplicate protection enabled

on:
  push:
    paths:
      - ".github/workflows/sample.yml"
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg + TTS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version

      - name: Verify subtitle support
        run: |
          ffmpeg -hide_banner -filters | grep -E '(^|[[:space:]])ass([[:space:]]|$)'

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Generate samples sequentially
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -e
          python main.py --topic "Top 5 Most Insane Parkour Moments"
          python main.py --topic "Top 5 Craziest Football Skills"
          python main.py --topic "Top 5 Most Satisfying Things to Watch"

      - name: Commit persistent Pexels history
        run: |
          if git diff --quiet -- data/pexels_history.json; then
            echo "No Pexels history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pexels_history.json
          git commit -m "Persist used Pexels clip history"
          git push

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: samples
          path: output/**/final.mp4
          if-no-files-found: error
          retention-days: 7
