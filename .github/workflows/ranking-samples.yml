name: Ranking Sample Generator

on:
  push:
    paths:
      - ".github/workflows/ranking-samples.yml"
      - "storyboard.py"
      - "render.py"
      - "audio.py"
      - "main.py"
      - "pexels_visuals.py"
      - "ai_video.py"
      - "captions.py"
  workflow_dispatch:

concurrency:
  group: ranking-samples
  cancel-in-progress: true

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: top5
            topic: "Top 5 Funniest Cat Moments"
          - id: top6
            topic: "Top 6 Craziest Football Skills"
          - id: top10
            topic: "Top 10 Most Satisfying Things to Watch"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg + TTS runtime
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v espeak-ng >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate ranking sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID_1 }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_flash_v2_5' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail
          python main.py --topic "${{ matrix.topic }}" 2>&1 | tee sample.log

      - name: Validate ranking sample
        run: |
          python - <<'PY'
          import json, glob, os
          manifests = glob.glob("output/**/manifest.json", recursive=True)
          if not manifests:
              raise SystemExit("No manifest generated")
          path = max(manifests, key=os.path.getmtime)
          m = json.load(open(path, encoding="utf-8"))
          entries = m.get("ranking_entries", [])
          scenes = m.get("scenes", [])
          expected = int("${{ matrix.id }}".replace("top", ""))
          print("format:", m.get("format"))
          print("entries:", len(entries))
          print("scenes:", len(scenes))
          print("voice:", m.get("generation", {}).get("voice"))
          if m.get("format") != "ranking":
              raise SystemExit("QC FAIL: not a ranking video")
          if len(entries) != expected or len(scenes) != expected:
              raise SystemExit(f"QC FAIL: expected {expected} entries/scenes")
          voice = m.get("generation", {}).get("voice")
          if voice not in {"elevenlabs", "edge_tts_fallback"}:
              raise SystemExit(f"QC FAIL: unsupported voice provider: {voice}")
          if voice != "elevenlabs":
              print("QC WARNING: ElevenLabs quota/unavailability triggered the approved fallback:", voice)
          ranks = [int(e.get("rank", 0)) for e in entries]
          if ranks != list(range(1, expected + 1)):
              raise SystemExit("QC FAIL: ranking order is wrong")
          ids = [str(s.get("pexels_id") or s.get("pexels_video_id") or "") for s in scenes if s.get("pexels_id") or s.get("pexels_video_id")]
          if len(ids) != len(set(ids)):
              raise SystemExit("QC FAIL: duplicate Pexels clip IDs inside sample")
          # Visual diversity QC must inspect the raw scene clips BEFORE
          # ranking/caption overlays. Comparing the finished video made the
          # rank text/captions dominate the perceptual hash and hid repeated
          # footage.
          import subprocess, io, glob
          from PIL import Image
          scene_paths=sorted(glob.glob("output/**/scenes/scene_*.mp4", recursive=True))
          if len(scene_paths) != expected:
              raise SystemExit(f"QC FAIL: expected {expected} raw scene files, found {len(scene_paths)}")
          def dhash(path, frac):
              dur=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0",path],text=True).strip())
              raw=subprocess.check_output(["ffmpeg","-hide_banner","-loglevel","error","-ss",str(max(0,dur*frac)),"-i",path,"-frames:v","1","-f","image2pipe","-vcodec","png","pipe:1"],timeout=20)
              im=Image.open(io.BytesIO(raw)).convert("L").resize((33,32))
              px=list(im.getdata()); bits=[]
              for y in range(32):
                  row=px[y*33:(y+1)*33]
                  bits.extend(row[x] < row[x+1] for x in range(32))
              return bits
          fps=[[dhash(p,x) for x in (0.25,0.50,0.75)] for p in scene_paths]
          def hamming(a,b): return sum(x!=y for x,y in zip(a,b))
          for i in range(len(fps)):
              for j in range(i+1,len(fps)):
                  ds=[hamming(fps[i][k],fps[j][k]) for k in range(3)]
                  if sum(d < 24 for d in ds) >= 2:
                      raise SystemExit(f"QC FAIL: raw scenes {i+1} and {j+1} are visually duplicated (dHash={ds})")
          print("Visual diversity QC PASS")
          print("QC PASS")
          PY

      - name: Upload sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-sample-${{ matrix.id }}
          path: |
            output/**/final.mp4
            output/**/manifest.json
            output/**/storyboard.json
            sample.log
          if-no-files-found: warn
          retention-days: 7
