name: YouTube Production Autopilot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: youtube-production-autopilot
  cancel-in-progress: true

jobs:
  autopilot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate production secrets
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID_1 }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then echo "::error::PEXELS_API_KEY is missing"; exit 1; fi
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::warning::ELEVENLABS_API_KEY is missing; fallback TTS will be used."; fi
          if [ -z "$ELEVENLABS_VOICE_ID" ]; then echo "::warning::ELEVENLABS_VOICE_ID is not set; the app will auto-select a voice."; fi

      - name: Generate one ranked YouTube Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID_1 }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_flash_v2_5' }}
          TREND_REGION: US
          TREND_LOOKBACK_HOURS: 24
        run: |
          set -o pipefail
          python main.py --autopilot 2>&1 | tee autopilot.log

      - name: Validate final ranked video
        run: |
          python - <<'PY'
          import glob, json, os, subprocess
          manifests = glob.glob("output/**/manifest.json", recursive=True)
          videos = glob.glob("output/**/final.mp4", recursive=True)
          if not manifests or not videos:
              raise SystemExit("QC FAIL: final video or manifest missing")
          manifest = max(manifests, key=os.path.getmtime)
          video = max(videos, key=os.path.getmtime)
          m = json.load(open(manifest, encoding="utf-8"))
          if m.get("format") != "ranking":
              raise SystemExit("QC FAIL: output is not ranking format")
          entries = m.get("ranking_entries", [])
          scenes = m.get("scenes", [])
          if len(entries) != len(scenes) or not 5 <= len(entries) <= 10:
              raise SystemExit("QC FAIL: ranking entry/scene count is invalid")
          ranks = [int(e.get("rank", 0)) for e in entries]
          if ranks != list(range(1, len(entries) + 1)):
              raise SystemExit("QC FAIL: ranking order is invalid")
          ids = [str(s.get("pexels_id", "")) for s in scenes if s.get("pexels_id")]
          if len(ids) != len(set(ids)):
              raise SystemExit("QC FAIL: duplicate Pexels IDs")
          probe = subprocess.run(["ffprobe","-v","error","-select_streams","a:0","-show_entries","stream=codec_name","-of","default=nw=1:nk=1",video], capture_output=True, text=True)
          if not probe.stdout.strip():
              raise SystemExit("QC FAIL: final video has no audio stream")
          print("QC PASS:", len(entries), "ranks,", probe.stdout.strip(), "audio")
          PY

      - name: Persist histories and diagnostics
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json data/pexels_history.json 2>/dev/null || true
          if [ -f autopilot.log ]; then cp autopilot.log data/last_autopilot.log; git add data/last_autopilot.log; fi
          git commit -m "Persist YouTube autopilot history" || true
          git push || true

      - name: Upload exactly three useful artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-production
          path: |
            output/**/final.mp4
            output/**/manifest.json
            output/**/storyboard.json
          if-no-files-found: warn
          retention-days: 7
