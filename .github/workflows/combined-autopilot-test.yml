name: Combined Autopilot Test

on:
  workflow_dispatch:
  push:
    paths:
      - "topic_engine.py"
      - "autopilot.py"
      - "trend_discovery.py"
      - "main.py"
      - "render.py"
      - "captions.py"
      - "pexels_visuals.py"
      - "storyboard.py"
      - ".github/workflows/combined-autopilot-test.yml"

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: FFmpeg + TTS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Generate one combined autopilot video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TREND_REGION: US
          TREND_LOOKBACK_HOURS: 24
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY secret is missing"; exit 1; }
          test -n "$PEXELS_API_KEY" || { echo "PEXELS_API_KEY secret is missing"; exit 1; }
          test -n "$YOUTUBE_API_KEY" || { echo "YOUTUBE_API_KEY secret is missing"; exit 1; }
          set +e
          python main.py --autopilot 2>&1 | tee autopilot.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Save failure details
        if: failure()
        run: |
          if [ -f autopilot.log ]; then
            mkdir -p data
            cp autopilot.log data/last_autopilot_error.txt
            echo "Captured autopilot failure log."
          fi
      - name: Commit histories and failure details
        if: always()
        run: |
          if git diff --quiet -- data/topic_history.json data/pexels_history.json data/last_autopilot_error.txt 2>/dev/null; then
            echo "No files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json data/pexels_history.json data/last_autopilot_error.txt 2>/dev/null || true
          git commit -m "Persist autopilot history and diagnostics" || true
          git push || true
      - name: Upload result and failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-autopilot-test
          path: |
            output/**/final.mp4
            output/**/manifest.json
            output/trends-*.json
            autopilot.log
          if-no-files-found: warn
          retention-days: 7
