name: YouTube Production Autopilot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: youtube-production-autopilot
  cancel-in-progress: true

jobs:
  autopilot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate production secrets
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          test -n "$PEXELS_API_KEY" || { echo "::error::PEXELS_API_KEY is missing"; exit 1; }
          test -n "$ELEVENLABS_API_KEY" || { echo "::error::ELEVENLABS_API_KEY is missing"; exit 1; }
          test -n "$ELEVENLABS_VOICE_ID" || { echo "::warning::ELEVENLABS_VOICE_ID is not set; the app will auto-select a voice." }

      - name: Generate one ranked YouTube Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID_1 }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_flash_v2_5' }}
          TREND_REGION: US
          TREND_LOOKBACK_HOURS: 24
        run: |
          set -o pipefail
          python main.py --autopilot 2>&1 | tee autopilot.log

      - name: Persist histories and diagnostics
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topic_history.json data/pexels_history.json 2>/dev/null || true
          if [ -f autopilot.log ]; then cp autopilot.log data/last_autopilot.log; git add data/last_autopilot.log; fi
          git commit -m "Persist YouTube autopilot history" || true
          git push || true

      - name: Upload exactly three useful artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-production
          path: |
            output/**/final.mp4
            output/**/manifest.json
            output/**/storyboard.json
          if-no-files-found: warn
          retention-days: 7
